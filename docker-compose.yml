services:
  pos:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3443
      POS_REQUIRE_HTTPS: "1"
      POS_TLS_CERT_PATH: /run/event-pos/tls/server.crt
      POS_TLS_KEY_PATH: /run/event-pos/tls/server.key
      POS_DATABASE_PATH: /var/lib/event-pos/event-pos.sqlite
      POS_EVENT_CONFIG_DIR: /workspace/event-config/demo
      POS_EVENT_CONFIG_REPOSITORY: /workspace
      GIT_AUTHOR_NAME: event-pos 管理画面
      GIT_AUTHOR_EMAIL: event-pos@localhost
      GIT_COMMITTER_NAME: event-pos 管理画面
      GIT_COMMITTER_EMAIL: event-pos@localhost
      POS_ARTIFACT_ROOT: /var/lib/event-pos/artifacts
      DRAWER_ENABLED: "1"
    ports:
      - "3443:3443"
    volumes:
      - pos-data:/var/lib/event-pos
      - ./.secrets/tls:/run/event-pos/tls:ro
      - ./:/workspace:ro
      - ./event-config:/workspace/event-config
      - ./.git:/workspace/.git
    healthcheck:
      test: ["CMD", "node", "-e", "require('https').get('https://127.0.0.1:3443/health/live',{rejectUnauthorized:false},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    develop:
      watch:
        - action: rebuild
          path: apps/server/src
        - action: rebuild
          path: apps/register-web/src
        - action: rebuild
          path: packages/contracts/src
        - action: rebuild
          path: Dockerfile
        - action: rebuild
          path: package.json
        - action: rebuild
          path: pnpm-lock.yaml
        - action: rebuild
          path: event-config

  pos-training:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      POS_REQUIRE_HTTPS: "0"
      POS_TLS_CERT_PATH: ""
      POS_TLS_KEY_PATH: ""
      POS_TRAINING_MODE: "1"
      POS_TRAINING_EVENT_ID: demo-event-large
      POS_REQUIRE_AUTH: "1"
      POS_DATABASE_PATH: ":memory:"
      POS_EVENT_CONFIG_DIR: /workspace/event-config/demo
      POS_ARTIFACT_ROOT: /tmp/event-pos-training-artifacts
      PRINTER_HOST_URL: http://host.docker.internal:4318
      DRAWER_ENABLED: "1"
    ports:
      - "3002:3000"
    volumes:
      - ./event-config:/workspace/event-config:ro
    depends_on:
      pos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pos-data:
