services:
  pos:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      POS_DATABASE_PATH: /var/lib/event-pos/event-pos.sqlite
    ports:
      - "3000:3000"
    volumes:
      - pos-data:/var/lib/event-pos
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    develop:
      watch:
        - action: rebuild
          path: apps/server/src
        - action: rebuild
          path: apps/register-web/src
        - action: rebuild
          path: packages/contracts/src
        - action: rebuild
          path: Dockerfile
        - action: rebuild
          path: package.json
        - action: rebuild
          path: pnpm-lock.yaml

volumes:
  pos-data:
